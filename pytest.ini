[pytest]
# Lets the tests import the app's top-level modules (tests/ has no __init__.py).
pythonpath = .
markers =
    archive_check: run the real pre-upload archive check instead of the default stub
    version_check: run the real restore version check instead of the default stub
    self_backup: make Backuparr's own backup for real at the end of run_backup
    key_prompt: start with the encryption key not yet saved, so the web UI is held at its prompt
