services:
  backuparr:
    build: /path/to/backuparr
    # or use the published image: rsaturns/backuparr:latest (Docker Hub)
    # or ghcr.io/rsaturns/backuparr:latest (GitHub Container Registry)
    container_name: backuparr
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # User/group the container runs as. Match ./data's owner (run `id`
      # there) if you want its files owned by you instead of 1000:1000.
      PUID: 1000
      PGID: 1000
      # Optional: disable local login when a reverse proxy (e.g. Authelia)
      # protects the entire UI and API. Block direct access to port 8990.
      # BACKUPARR_DISABLE_AUTH: "true"
    ports:
      - "8990:8990"
    volumes:
      # config.json, rclone.conf, and local-destination backups.
      - ./data:/config/backuparr
      # Optional: needed only to restore Bazarr - path to its config/backup folder.
      # - /share/Container/bazarr/backup:/mnt/bazarr-backup
      # Needed to back up Jellyfin - its backups folder (/config/data/backups in
      # the official image, /config/data/data/backups in linuxserver's).
      # Read-write so Backuparr can restore and tidy up.
      # - /share/Container/jellyfin/config/data/backups:/mnt/jellyfin-backups
      # Needed to back up Emby - the folder Emby has at /config (both the official
      # and linuxserver images). Read-only is enough for backups; read-write to
      # restore.
      # - /share/Container/emby/config:/mnt/emby:ro
      # Needed to back up Plex - its "Plex Media Server" folder, Library/
      # Application Support/Plex Media Server inside Plex's /config.
      # Read-only is enough for backups; read-write to restore.
      # - "/share/Container/plex/Library/Application Support/Plex Media Server:/mnt/plex:ro"
      # Needed to back up Seerr - the folder Seerr has at /app/config.
      # Read-only is enough for backups; read-write to restore.
      # - /share/Container/seerr/config:/mnt/seerr:ro
      # Needed to back up LazyLibrarian - the folder it has at /config. Read-write,
      # so each backup's file is removed from it and restores work.
      # - /share/Container/lazylibrarian/config:/mnt/lazylibrarian
      # Needed to back up Vaultwarden - the folder Vaultwarden has at /data.
      # Read-only is enough for backups; read-write to restore.
      # - /share/Container/vaultwarden/data:/mnt/vaultwarden:ro
