services:
  backuparr:
    build: /path/to/backuparr
    # or once you publish it: image: ghcr.io/<you>/backuparr:latest
    container_name: backuparr
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # Runs as this user/group instead of root - match the owner of
      # ./data on the host (run `id` there) if you want the files this
      # writes to be owned by your own user rather than the 1000:1000
      # default. Safe to change any time; ownership is fixed up
      # automatically on the next start either way.
      PUID: 1000
      PGID: 1000
      # The web UI creates its own admin account on first visit (a setup
      # screen) and requires logging in from then on - nothing to configure
      # here for that.
    ports:
      - "8990:8990"
    volumes:
      # Persists config.json, the generated rclone.conf (for Google Drive),
      # and local-destination backups across container recreation.
      - ./data:/config/backuparr
      # Optional: only needed if you want to restore Bazarr from the web UI
      # or CLI - a local path to Bazarr's own config/backup folder.
      # - /share/Container/bazarr/backup:/mnt/bazarr-backup
