# Add this service block into your existing stack's docker-compose.yml
# (the same file that defines radarr/sonarr/bazarr/prowlarr/sabnzbd) rather
# than running it as a separate project - it needs to be on the same
# Compose network to reach the other containers by name. Tdarr is the one
# exception if it runs with network_mode: host - address it by the host's
# LAN IP instead of a container name in that case.
#
# Everything app-specific (URLs, API keys, which apps/destinations are
# enabled, schedule) is configured through the web UI at :8990 the first
# time you start this, not through env vars here - config.json on the
# ./data volume is what persists it across restarts. Local storage works
# out of the box with zero setup; Google Drive is connected from the
# Settings tab itself (click Connect, no files to copy in by hand).
services:
  backuparr:
    build: /path/to/backuparr
    # or once you publish it: image: ghcr.io/<you>/backuparr:latest
    container_name: backuparr
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # The web UI creates its own admin account on first visit (a setup
      # screen) and requires logging in from then on - nothing to configure
      # here for that.
    ports:
      - "8990:8990"
    volumes:
      # Persists config.json, the generated rclone.conf (for Google Drive),
      # and local-destination backups across container recreation.
      - ./data:/config/backuparr
      # Optional: only needed if you want to restore Bazarr from the web UI
      # or CLI - a local path to Bazarr's own config/backup folder.
      # - /share/Container/bazarr/backup:/mnt/bazarr-backup
