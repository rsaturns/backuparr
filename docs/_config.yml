# .github/workflows/docs-site.yml builds this site from docs/ and publishes
# it from main.
title: Backuparr
description: Scheduled, encrypted backups of the apps you host, to local storage and the cloud.
url: https://docs.backuparr.com
baseurl: ""
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  # /sitemap.xml for search engines, and a /robots.txt pointing to it.
  - jekyll-sitemap

logo: https://raw.githubusercontent.com/rsaturns/backuparr/main/webui/static/logo.png
search_enabled: true
heading_anchors: true
aux_links:
  Website: https://backuparr.com
  GitHub: https://github.com/rsaturns/backuparr
  Docker Hub: https://hub.docker.com/r/rsaturns/backuparr
aux_links_new_tab: true
back_to_top: true
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/rsaturns/backuparr
# The branch these docs come from. The changelog and SECURITY.md links use
# it too.
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit
footer_content: "Backuparr is licensed under the <a href=\"https://github.com/rsaturns/backuparr/blob/main/LICENSE\">GNU AGPLv3</a>."

relative_links:
  enabled: true
  collections: true
