name: CI

# Every PR to main or to a release branch must pass the tests, the
# container smoke test and the Trivy gate on amd64 and arm64 (checks.yml,
# its jobs in parallel). The push trigger covers anything that lands on
# main outside a PR.
on:
  pull_request:
    branches:
      - main
      - 'release-*'
  push:
    branches:
      - main

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests and builds need nothing but read access.
permissions:
  contents: read

jobs:
  checks:
    name: checks
    # ./ is resolved from this same commit for a reusable workflow; GitHub's
    # newer $/ form isn't understood by every tool yet (actionlint 1.7.12).
    uses: ./.github/workflows/checks.yml  # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # The required status check in main's ruleset - keep the name. A skipped
  # required check counts as passed, so this runs whatever happened to the
  # checks and passes only when every one of them did.
  test-and-build:
    name: test-and-build
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = success ]
