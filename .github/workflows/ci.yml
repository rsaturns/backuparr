name: CI

# PR gate: every PR targeting main must pass tests and a clean multi-arch
# Docker build before it can merge. The push-to-main trigger is a safety
# net for anything that lands on main outside a PR (it doesn't replace
# branch protection - that's configured separately on the repo).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs on the same PR/branch so we're not burning
# minutes on a commit nobody cares about anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests and a validate-only build need nothing but read access.
permissions:
  contents: read

jobs:
  # Job name is referenced by branch protection as a required status
  # check - keep it stable.
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    # Actions are pinned to a commit, named in the comment; Dependabot
    # updates both.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python as the python:3.15-alpine image the app ships in.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Run the image, not just build it: catches a module missing from the
      # Dockerfile COPY list, entrypoint errors and a failing healthcheck.
      - name: Build Docker image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: backuparr:ci
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64

      - name: Smoke test the container
        run: scripts/smoke_test.sh backuparr:ci

      # Validates the Dockerfile builds cleanly on both target
      # architectures. Nothing is pushed anywhere from this workflow.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
