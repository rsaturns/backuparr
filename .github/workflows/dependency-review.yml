name: Dependency Review

# On every PR: fails when the PR brings in a package version with a known
# HIGH or CRITICAL vulnerability, or a package under a license outside the
# list below. That list is the permissive licenses (and certifi's MPL-2.0)
# that can ship inside an AGPL-3.0 app; a new license needs a decision
# before it's added. A package whose license GitHub can't tell is reported
# without failing.
on:
  pull_request:
    branches:
      - main
      - 'release-*'

permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review the PR's dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MIT-0,
            MPL-2.0, PSF-2.0, Python-2.0, Unlicense
