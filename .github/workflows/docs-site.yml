name: Docs site

# Builds the GitHub Pages site from docs/ - only when something under
# docs/ changes. A PR touching docs/ (to main or a release branch) gets a
# build check, so a release merged to main is known to build; a push to
# main also deploys it. Run it by hand to redeploy without a docs change.
on:
  pull_request:
    branches:
      - main
      - "release-*"
    paths:
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-way.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Actions are pinned to a commit, named in the comment; Dependabot
    # updates both.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Jekyll build (github-pages gem) GitHub runs for
      # branch-published sites.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
