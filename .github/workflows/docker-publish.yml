name: Docker Publish

# Deploy step: runs on every push to main (the "merge to main -> deploy"
# path) and on every v* tag push (formal version releases). Both paths
# re-run the test suite - direct pushes and tag pushes don't go through
# ci.yml's pull_request gate, so this is belt-and-suspenders, not
# redundant.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Never cancel a publish mid-push - a half-pushed multi-arch manifest is
# worse than a slightly delayed one.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # contents: write is needed for the GitHub Release step (v* tags
    # only); harmless on plain main pushes, where that step is skipped.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagging scheme:
      #   - push to main            -> DOCKERHUB_USERNAME/backuparr:latest
      #   - push of tag vX.Y.Z(-…)  -> DOCKERHUB_USERNAME/backuparr:X.Y.Z(-…)
      # Only one of these two rules is ever enabled for a given run,
      # since a push event's ref is either a branch ref or a tag ref,
      # never both - so exactly one tag is produced per run.
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backuparr
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below only runs on a v* tag push, not a plain main
      # push.
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Pulls the release body out of CHANGELOG.md's Keep-a-Changelog
      # "## [<version>]" section: everything between that header and the
      # next "## [" header (or end of file), with the header line itself
      # stripped.
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## \[|\Z)",
              re.DOTALL | re.MULTILINE,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"No CHANGELOG.md section found for version [{version}]")
          body = match.group(1).strip()

          print("body<<CHANGELOG_EOF")
          print(body)
          print("CHANGELOG_EOF")
          PY

      # Creates the release on first run for a tag, or updates it in
      # place if one already exists (e.g. a manually-created release for
      # the same tag) rather than failing on a duplicate.
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
