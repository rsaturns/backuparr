name: Docker Publish

# Deploy step: runs only on a v* tag push (a formal version release) -
# merging to main does not publish an image. Re-runs the test suite even
# though tag pushes don't go through ci.yml's pull_request gate, so this
# is belt-and-suspenders, not redundant.
on:
  push:
    tags:
      - "v*"

# Never cancel a publish mid-push - a half-pushed multi-arch manifest is
# worse than a slightly delayed one.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # contents: write is needed for the GitHub Release step below.
    permissions:
      contents: write
    # Actions are pinned to a commit, named in the comment; Dependabot
    # updates both.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python as ci.yml and the python:3.15-alpine image the app ships in.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every run is a vX.Y.Z(-…) tag push (see the `on:` trigger above),
      # so each release produces both the version tag and an updated
      # :latest.
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backuparr
          tags: |
            type=raw,value=latest
            type=match,pattern=v(.*),group=1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Pulls the release body out of CHANGELOG.md's Keep-a-Changelog
      # "## [<version>]" section: everything between that header and the
      # next "## [" header (or end of file), with the header line itself
      # stripped.
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## \[|\Z)",
              re.DOTALL | re.MULTILINE,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"No CHANGELOG.md section found for version [{version}]")
          body = match.group(1).strip()

          print("body<<CHANGELOG_EOF")
          print(body)
          print("CHANGELOG_EOF")
          PY

      # Creates the release on first run for a tag, or updates it in
      # place if one already exists (e.g. a manually-created release for
      # the same tag) rather than failing on a duplicate.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
