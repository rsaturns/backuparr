name: Docker Publish

# Deploy step: runs only on a v* tag push (a formal version release) -
# merging to main does not publish an image. Two jobs:
#   check    the tests, the smoke test and the Trivy gate, in a job that
#            holds no secrets and can't write anything - so a compromised
#            test dependency or scanner gets nothing worth stealing
#            (trivy-action's own tags were hijacked in March 2026; a pinned
#            commit is what kept this repository safe). Tag pushes don't go
#            through ci.yml's PR gate, and a vulnerability can be published
#            between the merge and the tag.
#   publish  only once check passes: builds and pushes the multi-arch image
#            and creates the GitHub Release.
# Both build from scratch: no build cache to carry a stale Alpine package
# (or anything else) into a release, and nothing reads the Actions cache.
on:
  push:
    tags:
      - "v*"

# Never cancel a publish mid-push - a half-pushed multi-arch manifest is
# worse than a slightly delayed one.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

cache-mode: none

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Actions are pinned to a commit, named in the comment; Dependabot
    # updates both.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In the Dockerfile's own base image, like ci.yml.
      - name: Run test suite
        run: scripts/test_in_image.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: backuparr:release

      - name: Smoke test the container
        run: scripts/smoke_test.sh backuparr:release

      # Same gate as ci.yml: a CRITICAL or HIGH vulnerability with a fix out
      # stops the release.
      - name: Scan the image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backuparr:release
          version: v0.76.2
          cache: false
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: publish
    needs: check
    runs-on: ubuntu-latest
    # contents: write is needed for the GitHub Release step below,
    # packages: write for the push to GitHub Container Registry.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every run is a vX.Y.Z(-…) tag push (see the `on:` trigger above):
      # each release gets its version tag, on Docker Hub and GHCR alike, and
      # a full release (no "-beta" or other suffix) also moves :latest, so a
      # beta never reaches containers that update themselves from :latest.
      # The image's
      # org.opencontainers.image.source label links the GHCR package to
      # this repository.
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backuparr
            ghcr.io/${{ github.repository_owner }}/backuparr
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=match,pattern=v(.*),group=1
          # Only the raw entry above may add latest: the default latest=auto
          # adds it for any matched tag, a beta included (it moved latest to
          # 3.0.0-beta).
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Pulls the release body out of CHANGELOG.md's Keep-a-Changelog
      # "## [<version>]" section: everything between that header and the
      # next "## [" header (or end of file), with the header line itself
      # stripped.
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## \[|\Z)",
              re.DOTALL | re.MULTILINE,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"No CHANGELOG.md section found for version [{version}]")
          body = match.group(1).strip()

          print("body<<CHANGELOG_EOF")
          print(body)
          print("CHANGELOG_EOF")
          PY

      # Creates the release on first run for a tag, or updates it in
      # place if one already exists (e.g. a manually-created release for
      # the same tag) rather than failing on a duplicate.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
