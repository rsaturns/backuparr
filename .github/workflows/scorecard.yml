name: Scorecard

# OpenSSF Scorecard's supply-chain checks (pinned dependencies, token
# permissions, branch rules, dangerous workflow patterns, ...) once a week
# and when main moves. Findings go to the Security tab beside CodeQL's.
# Results aren't published to the public Scorecard API (publish_results:
# false), so there's no badge; turning that on later needs the workflow
# restrictions in the action's README. Scorecard only supports the default
# branch, so this lives on main. Based on the action's own
# examples/scorecard-private.yml.
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write  # upload SARIF to code scanning
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
